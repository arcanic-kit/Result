name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v10.1.0 or v10.1.0-beta.1
  workflow_dispatch:  # Allow manual triggering
    inputs:
      version:
        description: 'Version to release (e.g., 10.1.0 or 10.1.0-beta.1)'
        required: true
        type: string

# GITHUB_TOKEN needs write access to create the release/tag and push to GitHub Packages.
permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for the main-branch ancestry check

    # The SDK is pinned by global.json; the 8.0 and 9.0 runtimes are installed
    # so the tests run against every target framework.
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Determine version
      id: version
      env:
        # Passed through env (not interpolated into the script) to avoid script injection.
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          VERSION="$INPUT_VERSION"
        else
          VERSION="${GITHUB_REF_NAME#v}"
        fi

        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::'$VERSION' is not a valid SemVer version (expected e.g. 10.1.0 or 10.1.0-beta.1)"
          exit 1
        fi

        # AssemblyVersion/FileVersion must be numeric: strip any prerelease suffix.
        NUMERIC="${VERSION%%-*}"

        {
          echo "VERSION=$VERSION"
          echo "NUMERIC=$NUMERIC"
          if [[ "$VERSION" == *-* ]]; then echo "PRERELEASE=true"; else echo "PRERELEASE=false"; fi
        } >> "$GITHUB_OUTPUT"
        echo "Package version: $VERSION (assembly $NUMERIC.0)"

    - name: Verify commit is on main
      run: |
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Releases must be built from a commit on main ($GITHUB_SHA is not)."
          exit 1
        fi

    - name: Restore dependencies
      run: dotnet restore Arcanic.Result.slnx

    - name: Build solution
      run: |
        dotnet build Arcanic.Result.slnx \
          --configuration Release \
          --no-restore \
          -p:Version=${{ steps.version.outputs.VERSION }} \
          -p:AssemblyVersion=${{ steps.version.outputs.NUMERIC }}.0 \
          -p:FileVersion=${{ steps.version.outputs.NUMERIC }}.0

    # Microsoft Testing Platform mode (enabled in global.json); coverage via coverlet.MTP.
    - name: Run tests
      run: |
        dotnet test --solution Arcanic.Result.slnx \
          --configuration Release \
          --no-build \
          --results-directory ./coverage \
          --coverlet \
          --coverlet-output-format cobertura

    # Only src/ projects are packable (see Directory.Build.props). Pack also runs
    # package validation against the previous release.
    - name: Create packages
      run: |
        rm -rf ./packages
        dotnet pack Arcanic.Result.slnx \
          --configuration Release \
          --no-build \
          --output ./packages \
          -p:Version=${{ steps.version.outputs.VERSION }}

    - name: List package contents
      run: |
        for pkg in ./packages/*.nupkg ./packages/*.snupkg; do
          echo "== $(basename "$pkg")"
          unzip -l "$pkg" | grep -E '\.(dll|pdb)$' || echo "   (no dll/pdb)"
        done

    - name: Upload packages as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages-${{ steps.version.outputs.VERSION }}
        path: |
          ./packages/*.nupkg
          ./packages/*.snupkg
        retention-days: 90

    - name: Publish to GitHub Packages
      run: |
        dotnet nuget push "./packages/*.nupkg" \
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
          --api-key "${{ secrets.GITHUB_TOKEN }}" \
          --skip-duplicate

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ steps.version.outputs.VERSION }}
        PRERELEASE: ${{ steps.version.outputs.PRERELEASE }}
      run: |
        TAG="v$VERSION"
        NOTES=".github/release-notes/$TAG.md"

        args=(--title "Release $VERSION" --target "$GITHUB_SHA")
        if [ -f "$NOTES" ]; then
          args+=(--notes-file "$NOTES")
        else
          echo "No $NOTES found; generating notes from merged PRs."
          args+=(--generate-notes)
        fi
        if [ "$PRERELEASE" = "true" ]; then
          args+=(--prerelease)
        fi

        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG already exists; skipping."
        else
          gh release create "$TAG" "${args[@]}" ./packages/*.nupkg ./packages/*.snupkg
        fi

    # NuGet.org last: a published version can be unlisted but never replaced.
    - name: Publish to NuGet.org
      run: |
        dotnet nuget push "./packages/*.nupkg" \
          --source https://api.nuget.org/v3/index.json \
          --api-key "${{ secrets.NUGET_API_KEY }}" \
          --skip-duplicate \
          --timeout 300
