name: Build and Test

on:
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The SDK is pinned by global.json; the 8.0 and 9.0 runtimes are installed
    # so the test project runs against every target framework.
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore Arcanic.Result.slnx

    - name: Build
      run: dotnet build Arcanic.Result.slnx --configuration Release --no-restore

    - name: Test
      run: |
        dotnet test Arcanic.Result.slnx \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./coverage

    - name: Pack (validation)
      run: |
        dotnet pack Arcanic.Result.slnx \
          --configuration Release \
          --no-build \
          --output ./packages

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: ./coverage/**/*
        retention-days: 30